<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordSmart | Master Your Vocabulary</title>
  <meta name="description" content="Master vocabulary from Word Smart 1 & 2 with interactive flashcards, progress tracking, Bangla meanings, and smart review tools." />
  <meta name="keywords" content="Word Smart, vocabulary, GRE, flashcards, Bangla, English vocabulary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background Orbs -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- ========== HEADER ========== -->
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Word<span class="logo-accent">Smart</span></span>
      </div>

      <nav class="book-tabs" role="tablist" aria-label="Book selection">
        <button id="tab-ws1" class="tab-btn active" role="tab" aria-selected="true" aria-controls="main-content" onclick="switchBook('ws1')">
          <span class="tab-icon">📘</span> Word Smart 1
        </button>
        <button id="tab-ws2" class="tab-btn" role="tab" aria-selected="false" aria-controls="main-content" onclick="switchBook('ws2')">
          <span class="tab-icon">📗</span> Word Smart 2
        </button>
      </nav>

      <div class="header-actions">
        <button id="view-toggle-btn" class="icon-btn" onclick="toggleView()" title="Toggle view" aria-label="Toggle flashcard or list view">
          <svg id="view-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
        <button id="theme-toggle-btn" class="icon-btn" onclick="toggleTheme()" title="Toggle dark/light mode" aria-label="Toggle dark or light mode">
          <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ========== PROGRESS BAR ========== -->
  <div class="progress-section" role="progressbar" aria-label="Words covered progress">
    <div class="progress-info">
      <span class="progress-label" id="progress-label">Progress</span>
      <span class="progress-count" id="progress-count">0 / 0 words covered</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      <div class="progress-glow" id="progress-glow" style="width: 0%"></div>
    </div>
    <span class="progress-pct" id="progress-pct">0%</span>
  </div>

  <!-- ========== MAIN CONTENT ========== -->
  <main id="main-content" class="main-layout">

    <!-- -------- FLASHCARD VIEW -------- -->
    <section id="flashcard-view" class="flashcard-section" aria-label="Flashcard study area">

      <!-- Navigation Controls -->
      <div class="card-nav">
        <button id="prev-btn" class="nav-btn" onclick="navigate(-1)" aria-label="Previous word">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>

        <div class="card-counter">
          <span id="card-index">1</span>
          <span class="card-sep">/</span>
          <span id="card-total">0</span>
        </div>

        <button id="next-btn" class="nav-btn" onclick="navigate(1)" aria-label="Next word">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <!-- Flashcard -->
      <div class="card-scene" onclick="flipCard()" role="button" tabindex="0" aria-label="Flashcard - click to flip" onkeydown="if(event.key==='Enter'||event.key===' ')flipCard()">
        <div class="card-body" id="card-body">

          <!-- Front -->
          <div class="card-face card-front">
            <div class="card-badge" id="card-badge">Word Smart 1</div>
            <div class="card-word" id="card-word">Loading...</div>
            <div class="flip-hint">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              Click to reveal
            </div>
          </div>

          <!-- Back -->
          <div class="card-face card-back">
            <div class="back-section">
              <div class="back-label">Definition</div>
              <div class="back-definition" id="back-definition">—</div>
            </div>
            <div class="back-divider"></div>
            <div class="back-section">
              <div class="back-label bangla-label">বাংলা অর্থ</div>
              <div class="back-bangla" id="back-bangla">—</div>
            </div>
            <div class="back-divider"></div>
            <div class="back-section">
              <div class="back-label">Example Phrases</div>
              <ul class="back-phrases" id="back-phrases"></ul>
            </div>
          </div>

        </div>
      </div>

      <!-- Action Buttons -->
      <div class="card-actions">
        <button id="covered-btn" class="action-btn covered-btn" onclick="markCovered()" aria-label="Mark word as covered">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span id="covered-btn-text">Mark as Covered</span>
        </button>
        <button class="action-btn shuffle-btn" onclick="shuffleCards()" aria-label="Shuffle cards">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
          Shuffle
        </button>
        <button class="action-btn reset-btn" onclick="resetProgress()" aria-label="Reset all progress">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Reset
        </button>
      </div>
    </section>

    <!-- -------- LIST VIEW (Covered Words) -------- -->
    <section id="list-view" class="list-section hidden" aria-label="Covered words list">
      <div class="list-header">
        <h2 class="list-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Covered Words
        </h2>
        <div class="list-stats" id="list-stats">0 words mastered</div>
      </div>

      <div id="covered-list-empty" class="list-empty">
        <div class="empty-icon">📚</div>
        <p>No words covered yet.</p>
        <p class="empty-sub">Start studying and mark words as covered!</p>
      </div>

      <div id="covered-list" class="covered-grid"></div>
    </section>

  </main>

  <!-- ========== TOAST NOTIFICATION ========== -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script src="sourceData.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
