<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordSmart — Vocabulary Trainer</title>
  <meta name="description" content="Study vocabulary from Word Smart 1 and 2 with interactive flashcards, Bangla meanings, and progress tracking." />
  <meta name="keywords" content="Word Smart, vocabulary, GRE, flashcards, Bangla, English" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div class="header-inner">

      <div class="logo">
        <span class="logo-mark">W</span>
        <span class="logo-text">WordSmart</span>
      </div>

      <nav class="book-tabs" role="tablist" aria-label="Book selection">
        <button id="tab-ws1" class="tab-btn active" role="tab" aria-selected="true" onclick="switchBook('ws1')">
          Word Smart 1
        </button>
        <button id="tab-ws2" class="tab-btn" role="tab" aria-selected="false" onclick="switchBook('ws2')">
          Word Smart 2
        </button>
      </nav>

      <div class="header-actions">
        <button id="view-toggle-btn" class="icon-btn" onclick="toggleView()" title="Toggle view" aria-label="Toggle flashcard or list view">
          <!-- Grid icon = list view, Card icon = flashcard view -->
          <svg id="icon-grid" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          <svg id="icon-card" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="hidden">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
          </svg>
        </button>
        <button id="theme-toggle-btn" class="icon-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle dark or light mode">
          <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="hidden">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- ===== PROGRESS BAR ===== -->
  <div class="progress-bar-wrap">
    <div class="progress-meta">
      <span id="progress-count">0 / 0 covered</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-track" role="progressbar" aria-label="Words covered">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- ===== MAIN ===== -->
  <main id="main-content" class="main-wrap">

    <!-- FLASHCARD VIEW -->
    <section id="flashcard-view" class="flashcard-section" aria-label="Flashcard study area">

      <div class="card-nav">
        <button id="prev-btn" class="nav-btn" onclick="navigate(-1)" aria-label="Previous word">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <span class="card-counter">
          <span id="card-index">1</span><span class="sep">/</span><span id="card-total">0</span>
        </span>
        <button id="next-btn" class="nav-btn" onclick="navigate(1)" aria-label="Next word">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>

      <!-- The card -->
      <div class="card-scene"
           id="card-scene"
           onclick="flipCard()"
           role="button"
           tabindex="0"
           aria-label="Flashcard. Click or press Enter to flip."
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipCard();}">

        <div class="card-body" id="card-body">

          <!-- Front face -->
          <div class="card-face card-front">
            <span class="card-label" id="card-badge">Word Smart 1</span>
            <h1 class="card-word" id="card-word">—</h1>
            <span class="card-hint">Click to reveal definition</span>
          </div>

          <!-- Back face -->
          <div class="card-face card-back">
            <div class="back-row">
              <span class="back-tag">Definition</span>
              <p class="back-definition" id="back-definition">—</p>
            </div>
            <hr class="back-rule" />
            <div class="back-row">
              <span class="back-tag">বাংলা অর্থ</span>
              <p class="back-bangla" id="back-bangla">—</p>
            </div>
            <hr class="back-rule" />
            <div class="back-row">
              <span class="back-tag">Examples</span>
              <ul class="back-phrases" id="back-phrases"></ul>
            </div>
          </div>

        </div>
      </div>

      <!-- Actions -->
      <div class="card-actions">
        <button id="covered-btn" class="btn btn-primary" onclick="markCovered()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span id="covered-btn-text">Mark as Covered</span>
        </button>
        <button class="btn btn-secondary" onclick="shuffleCards()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
          </svg>
          Shuffle
        </button>
        <button class="btn btn-ghost" onclick="resetProgress()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
          </svg>
          Reset
        </button>
      </div>

      <p class="shortcuts-hint">
        Arrow keys to navigate &nbsp;·&nbsp; Space to flip &nbsp;·&nbsp; C to mark covered
      </p>

    </section>

    <!-- LIST VIEW (Covered Words) -->
    <section id="list-view" class="list-section hidden" aria-label="Covered words">

      <div class="list-header">
        <h2 class="list-title">Covered Words</h2>
        <span class="list-badge" id="list-stats">0 words</span>
      </div>

      <div id="covered-list-empty" class="list-empty">
        <p>No covered words yet.</p>
        <p class="list-empty-sub">Mark words as covered from the flashcard view.</p>
      </div>

      <div id="covered-list" class="covered-grid"></div>

    </section>

  </main>

  <!-- TOAST -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script src="sourceData.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
